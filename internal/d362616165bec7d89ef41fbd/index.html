<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Model Console — GREEN18 (internal)</title>
<!-- Gated operator surface: served only to a principal holding the `operator`
     role (Entra), plus noindex/robots as defence in depth. Lives on the
     internal-console branch, never on a branch a static host publishes
     unauthenticated. See docs/model-console.md. -->
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="referrer" content="no-referrer">
<link rel="stylesheet" href="/assets/console.css">
</head>
<body>

<div class="bar">
  <span class="mark">18</span>
  <h1>Model Console</h1>
  <span class="tag">Internal</span>
  <span class="clock" id="clock"></span>
  <span class="spacer"></span>
  <button class="qbtn" type="button" id="undo">Undo pick</button>
</div>

<div class="shell">

  <section class="pane">
    <header>
      <span>Live draft room</span>
      <span class="spacer" style="flex:1"></span>
      <span class="roster" id="roster"></span>
      <span class="clock" id="remaining"></span>
    </header>
    <div class="scroll">
      <table class="board">
        <thead>
          <tr>
            <th style="width:3ch">#</th>
            <th>Player</th>
            <th style="text-align:right">Base</th>
            <th style="text-align:right">Dials</th>
            <th style="text-align:right">Queue</th>
            <th style="text-align:right">Value</th>
            <th style="text-align:right">ADP</th>
            <th style="width:3ch"></th>
            <th style="width:5ch"></th>
          </tr>
        </thead>
        <tbody id="board-body"></tbody>
      </table>
    </div>
  </section>

  <section class="pane">
    <header>
      <div class="tabs" role="tablist">
        <button type="button" role="tab" data-tab="preferences" aria-selected="true">Preferences</button>
        <button type="button" role="tab" data-tab="settings" aria-selected="false">Settings</button>
        <button type="button" role="tab" data-tab="scoring" aria-selected="false">Scoring</button>
      </div>
    </header>
    <div class="scroll">
      <div class="tabpanel" id="tab-preferences" role="tabpanel"></div>
      <div class="tabpanel" id="tab-settings" role="tabpanel" hidden></div>
      <div class="tabpanel" id="tab-scoring" role="tabpanel" hidden></div>
    </div>
  </section>

</div>

<script src="/assets/engine.js"></script>
<script src="/assets/console.js"></script>
</body>
</html>
