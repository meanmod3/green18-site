<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Model Console — GREEN18 (internal)</title>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="referrer" content="no-referrer">
<link rel="stylesheet" href="/assets/site.css">
<link rel="stylesheet" href="/assets/console.css?v=1788932039">
</head>
<body>

<header class="site">
  <div class="wrap">
    <a class="wordmark" href="/" aria-label="GREEN18 — home"><img src="/assets/mark.png" alt="" width="28" height="18" decoding="async"></a>
    <nav aria-label="Primary">
      <a href="/how-green18-ranks-fantasy-players">How It Works</a>
      <a href="/draft-science/">Draft Science</a>
      <a href="/scenarios/">Scenarios</a>
      <a href="/tools/">Tools</a>
      <a href="/glossary">Glossary</a>
    </nav>
    <a class="btn" href="https://apps.apple.com/us/app/id6805706417">iOS App</a>
  </div>
</header>

<section id="setup" class="setup" hidden>
  <div class="setup-card">
    <h2>New league</h2>
    <p class="hint">Everything is stored in this browser only — the same local-first posture as the app.</p>
    <div id="setup-form"></div>
  </div>
</section>

<div class="shell" id="app" hidden>

  <section class="pane">
    <header>
      <span>Live draft room</span>
      <span class="clock" id="clock"></span>
      <span class="spacer" style="flex:1"></span>
      <span class="tag">Internal</span>
      <button class="ghost" type="button" id="undo" hidden>Undo pick</button>
    </header>
    <div class="filters" id="filters"></div>
    <div class="scroll">
      <table class="board">
        <thead>
          <tr>
            <th style="width:3ch">#</th>
            <th>Player</th>
            <th style="text-align:right">Proj<span class="sub">points</span></th>
            <th style="text-align:right">Base<span class="sub">-live ADP</span></th>
            <th style="text-align:right">Dials</th>
            <th style="text-align:right">Queue</th>
            <th style="text-align:right">Value</th>
            <th style="text-align:right">Mkt</th>
            <th style="text-align:right">Surv</th>
            <th style="width:3ch"></th>
            <th style="width:5ch"></th>
          </tr>
        </thead>
        <tbody id="board-body"></tbody>
      </table>
    </div>
    <div class="roster-footer" id="roster-footer"></div>
  </section>

  <section class="pane" id="stepper-pane" hidden>
    <header><span>Set up your draft</span></header>
    <div class="scroll"><div id="stepper" class="stepper"></div></div>
  </section>

  <section class="pane" id="tabs-pane" hidden>
    <header>
      <div class="tabs" role="tablist">
        <button type="button" role="tab" data-tab="player" aria-selected="false">Player</button>
        <button type="button" role="tab" data-tab="queue" aria-selected="true">Queue</button>
        <button type="button" role="tab" data-tab="preferences" aria-selected="false">Prefs</button>
        <button type="button" role="tab" data-tab="settings" aria-selected="false">League</button>
        <button type="button" role="tab" data-tab="scoring" aria-selected="false">Scoring</button>
      </div>
    </header>
    <div class="scroll">
      <div class="tabpanel" id="tab-player" role="tabpanel" hidden></div>
      <div class="tabpanel" id="tab-queue" role="tabpanel"></div>
      <div class="tabpanel" id="tab-preferences" role="tabpanel" hidden></div>
      <div class="tabpanel" id="tab-settings" role="tabpanel" hidden></div>
      <div class="tabpanel" id="tab-scoring" role="tabpanel" hidden></div>
    </div>
  </section>

</div>

<script src="/assets/engine.js?v=1788932039"></script>
<script src="/assets/console.js?v=1788932039"></script>
</body>
</html>
