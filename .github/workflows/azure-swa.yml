# Deploy the built site to Azure Static Web Apps.
#
# Why this exists: the repo root IS the site root, and Azure was previously
# deployed only by hand. That let the Azure host drift stale while GitHub Pages
# served the current build — two live hosts disagreeing about the product.
#
# Runner policy: ubuntu only. macOS/Windows runners are banned in every
# governed repo (10x/2x billing multipliers), and this job is a light build
# plus an upload.
name: Deploy to Azure Static Web Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: swa-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The build regenerates every page and enforces the content invariants,
      # so a push that violates one fails here rather than reaching the host.
      - name: Build and verify invariants
        run: node src/build.mjs

      # Azure refuses a deploy whose source directory contains the artifact,
      # which is the case when the site root is the repo root. Stage instead.
      - name: Stage deploy artifact
        run: |
          rm -rf _artifact && mkdir -p _artifact
          rsync -a \
            --exclude='.git' --exclude='.github' --exclude='src' \
            --exclude='docs' --exclude='node_modules' --exclude='_artifact' \
            --exclude='*.md' --exclude='package*.json' \
            ./ _artifact/
          test -f _artifact/index.html
          test -f _artifact/staticwebapp.config.json
          test -f _artifact/llms.txt

      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: '_artifact'
          skip_app_build: true
          skip_api_build: true
